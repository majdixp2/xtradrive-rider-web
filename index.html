<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>XtraDrive</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #060D19;
    --surface: #0A2140;
    --surface-alt: #13243A;
    --border: #1C3A63;
    --divider: #142238;
    --text: #FFFFFF;
    --muted: #AFC1D6;
    --accent: #B0FC40;
    --accent-text: #B0FC40;
    --accent-on-fill: #00112B;
    --danger: #FF6B64;
    --gold: #FFD84D;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F4F6F9;
      --surface: #FFFFFF;
      --surface-alt: #EEF1F6;
      --border: #E1E6EC;
      --divider: #E1E6EC;
      --text: #101A2B;
      --muted: #5B6B7F;
      --accent: #B0FC40;
      --accent-text: #3B8F1E;
      --accent-on-fill: #00112B;
      --danger: #D8393A;
      --gold: #B8860B;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex; justify-content: center; padding: 28px 16px 60px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .logo { color: var(--accent-text); font-size: 28px; font-weight: 900; text-align: center; margin-bottom: 6px; }
  .title { color: var(--text); font-size: 19px; font-weight: 700; text-align: center; margin: 0 0 20px; }
  .muted { color: var(--muted); font-size: 16px; text-align: center; margin-top: 40px; }
  .error { color: var(--danger); font-size: 15px; text-align: center; margin-top: 40px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 12px; }
  .card .label { color: var(--muted); font-size: 13px; }
  .card .value { color: var(--text); font-size: 18px; font-weight: 800; margin-top: 4px; }
  .rates { display: flex; gap: 8px; margin-bottom: 12px; }
  .rate-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
  .rate-card .label { color: var(--muted); font-size: 11px; display: block; }
  .rate-card .value { color: var(--text); font-size: 14px; font-weight: 700; display: block; margin-top: 4px; }
  .btn { display: block; width: 100%; border: none; border-radius: 13px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; }
  .btn-primary { background: var(--accent); color: var(--accent-on-fill); }
  .btn-primary:disabled { opacity: 0.6; animation: none; }
  .btn-primary:not(:disabled) { animation: pulseGlow 1.6s ease-in-out infinite; }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(176, 252, 64, 0.55); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(176, 252, 64, 0); transform: scale(1.02); }
  }
  .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent-text); margin-top: 14px; }
  .pending { background: var(--surface); border: 1px solid var(--accent); border-radius: 13px; padding: 14px; text-align: center; color: var(--accent-text); font-weight: 700; font-size: 14px; margin-bottom: 12px; }
  .live-card, .invoice-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .live-title { color: var(--accent-text); font-weight: 800; font-size: 13px; margin: 0 0 10px; }
  .invoice-title { color: var(--gold); font-weight: 800; font-size: 15px; margin: 0 0 10px; }
  .metric-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--divider); }
  .metric-row:last-child { border-bottom: none; }
  .metric-row .m-label { color: var(--muted); font-size: 13px; }
  .metric-row .m-value { color: var(--text); font-size: 14px; font-weight: 700; }
  .metric-row.total { border-top: 2px solid var(--accent); margin-top: 4px; padding-top: 10px; }
  .metric-row.total .m-label { color: var(--text); font-weight: 800; font-size: 14px; }
  .metric-row.total .m-value { color: var(--accent-text); font-size: 24px; font-weight: 900; }
  .promo { margin-top: 26px; text-align: center; padding-top: 18px; border-top: 1px dashed var(--border); }
  .promo p { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .promo a, .promo .soon { display: inline-block; background: var(--surface-alt); border: 1px solid var(--accent); color: var(--accent-text); border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="logo">XtraDrive</div>
  <p class="muted">جاري تحميل الجلسة...</p>
</div>

<script>
const API_URL = "https://xtradrive-backend.vercel.app/api";
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const app = document.getElementById("app");
let approving = false;

function fmtTime(s) {
  s = s || 0;
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const sec = (s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}

function promoBlock() {
  return `
    <div class="promo">
      <p>جرّبت الخدمة عبر المتصفح — التطبيق الكامل قادم قريباً بمزايا إضافية</p>
      <span class="soon">التطبيق قادم قريباً 🚀</span>
    </div>`;
}

function render(session) {
  if (!session) {
    app.innerHTML = `
      <div class="logo">XtraDrive</div>
      <p class="error">تعذر العثور على الجلسة: ${code || ""}</p>
      ${promoBlock()}`;
    return;
  }

  const pricePerKm = (Number(session.pricePerMeter) || 0) * 1000;
  const pricePerMinute = (Number(session.pricePerSecond) || 0) * 60;
  const baseFare = Number(session.baseFare) || 0;
  const rideTypeLabel = session.type === "waiting" ? "انتظار مدفوع" : "مشوار إضافي";

  let actionHtml = "";
  if (session.status === "waiting") {
    actionHtml = `<button class="btn btn-primary" id="approveBtn" ${approving ? "disabled" : ""}>${approving ? "جاري الموافقة..." : "موافق - ابدأ"}</button>`;
  } else if (session.status === "approved") {
    actionHtml = `<div class="pending">تمت الموافقة — سيبدأ العداد تلقائياً الآن</div>`;
  }

  let liveHtml = "";
  if (session.status === "running" || session.status === "approved") {
    liveHtml = `
      <div class="live-card">
        <p class="live-title">● مباشر</p>
        <div class="metric-row"><span class="m-label">الوقت</span><span class="m-value">${fmtTime(session.seconds)}</span></div>
        <div class="metric-row"><span class="m-label">المسافة</span><span class="m-value">${(((session.distance || 0) / 1000).toFixed(3))} كم</span></div>
        <div class="metric-row"><span class="m-label">قيمة الوقت</span><span class="m-value">${session.timeEarnings || "0.00"} ر.س</span></div>
        <div class="metric-row"><span class="m-label">قيمة المسافة</span><span class="m-value">${session.distanceEarnings || "0.00"} ر.س</span></div>
        <div class="metric-row total"><span class="m-label">الإجمالي</span><span class="m-value">${session.totalEarnings || baseFare.toFixed(2)} ر.س</span></div>
      </div>`;
  }

  let invoiceHtml = "";
  if (session.status === "completed") {
    invoiceHtml = `
      <div class="invoice-card">
        <p class="invoice-title">🧾 النتيجة النهائية</p>
        <div class="metric-row"><span class="m-label">الوقت</span><span class="m-value">${fmtTime(session.seconds)}</span></div>
        <div class="metric-row"><span class="m-label">المسافة</span><span class="m-value">${(((session.distance || 0) / 1000).toFixed(3))} كم</span></div>
        <div class="metric-row"><span class="m-label">فتح العداد</span><span class="m-value">${baseFare.toFixed(2)} ر.س</span></div>
        <div class="metric-row total"><span class="m-label">الإجمالي</span><span class="m-value">${session.totalEarnings || "0.00"} ر.س</span></div>
      </div>`;
  }

  app.innerHTML = `
    <div class="logo">XtraDrive</div>
    <p class="title">تفاصيل المشوار</p>
    <div class="card">
      <p class="label">نوع الخدمة</p>
      <p class="value">${rideTypeLabel}</p>
    </div>
    <div class="rates">
      <div class="rate-card"><span class="label">سعر الكيلومتر</span><span class="value">${pricePerKm.toFixed(2)} ر.س</span></div>
      <div class="rate-card"><span class="label">سعر الدقيقة</span><span class="value">${pricePerMinute.toFixed(2)} ر.س</span></div>
      <div class="rate-card"><span class="label">فتح العداد</span><span class="value">${baseFare.toFixed(2)} ر.س</span></div>
    </div>
    ${actionHtml}
    ${liveHtml}
    ${invoiceHtml}
    ${promoBlock()}
  `;

  const approveBtn = document.getElementById("approveBtn");
  if (approveBtn) approveBtn.addEventListener("click", handleApprove);
}

async function handleApprove() {
  if (approving || !code) return;
  approving = true;
  render(lastSession);
  try {
    await fetch(`${API_URL}/sessions/${encodeURIComponent(code)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "approved" }),
    });
  } finally {
    approving = false;
    void tick();
  }
}

let lastSession = null;
async function tick() {
  if (!code) { render(null); return; }
  try {
    const res = await fetch(`${API_URL}/sessions/${encodeURIComponent(code)}`, { cache: "no-store" });
    if (!res.ok) throw new Error("not-found");
    lastSession = await res.json();
    render(lastSession);
  } catch {
    render(null);
  }
}

tick();
setInterval(tick, 1500);
</script>
</body>
</html>
